[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-job-scout"
version = "0.1.0"
description = "Configurable faculty job scout with live sources and LLM-assisted ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "faculty-job-scout maintainers" }]
dependencies = [
  "openai>=2.0.0",
  "pydantic>=2.7",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
faculty-job-scout = "faculty_job_scout.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
